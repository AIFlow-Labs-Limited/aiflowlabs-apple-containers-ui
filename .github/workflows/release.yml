name: Release

on:
  # Manual only: releases are built locally with `scripts/publish-release.sh`. Keep for an on-demand runner build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    name: Build DMG and publish release
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            xcode=/Applications/Xcode_27.0.app
          else
            xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n 1)"
          fi
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Derive version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Test
        run: swift test

      # Ad-hoc signed until Developer ID secrets are configured (see docs/release/RELEASING.md); the release
      # notes below tell users how to open an unsigned build.
      - name: Build DMG
        run: make dmg VERSION="${{ steps.version.outputs.version }}"

      - name: Checksum
        run: |
          cd build
          shasum -a 256 "Container-Desktop-${{ steps.version.outputs.version }}-arm64.dmg" \
            > "Container-Desktop-${{ steps.version.outputs.version }}-arm64.dmg.sha256"
          cat ./*.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            > **This build is not notarized yet** (ad-hoc signed until a Developer ID is configured).
            > On first launch macOS blocks it. Either open **System Settings → Privacy & Security**, scroll to
            > the message about Container Desktop and click **Open Anyway**, or run once in Terminal:
            > `xattr -dr com.apple.quarantine "/Applications/Container Desktop.app"`
            > Verify the download first: `shasum -a 256 -c Container-Desktop-<version>-arm64.dmg.sha256`.
          prerelease: ${{ contains(inputs.tag, '-') }}
          tag_name: ${{ inputs.tag }}
          files: |
            build/Container-Desktop-${{ steps.version.outputs.version }}-arm64.dmg
            build/Container-Desktop-${{ steps.version.outputs.version }}-arm64.dmg.sha256
