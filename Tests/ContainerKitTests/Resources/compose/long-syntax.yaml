# Long syntax for ports, volumes, env_file and depends_on; custom networks; resource limits under deploy.
name: longform
services:
  proxy:
    image: nginx:1.27
    container_name: edge-proxy
    ports:
      - target: 80
        published: 8080
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 53
        published: "5353"
        protocol: udp
      - "9000-9002:9000-9002"
      - "[::1]:8443:443"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: volume
        source: certs
        target: /etc/ssl/private
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          size: 64m
      - /var/log/nginx
    env_file:
      - common.env
      - path: local.env
        required: false
    networks:
      frontend:
      backend:
        aliases: [gateway]
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 512
    cap_add: [NET_BIND_SERVICE]
    cap_drop: [ALL]
    shm_size: 128m
  app:
    image: example/app
    networks: [backend]
    profiles: [full]
networks:
  frontend:
  backend:
    ipam:
      config:
        - subnet: 192.168.90.0/24
  shared:
    external: true
volumes:
  certs:
    name: tls-certs
  legacy:
    external: true
